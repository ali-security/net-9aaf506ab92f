name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Space-separated Go test names to run; empty runs the full suite
        required: false
        default: ""

permissions:
  contents: read

jobs:
  module-zip:
    name: Build module zip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build module-zip helper
        run: |
          set -eux
          HELPER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" ./create_mod.go

      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" golang.org/x/net v0.45.0 \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.45.0.zip" | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.45.0.zip
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        run: |
          set -eux
          go build ./...

      - name: Test
        run: |
          set -eux
          if [ -n "${{ inputs.test-filter }}" ]; then
            go test -v -run "^($(echo "${{ inputs.test-filter }}" | tr ' ' '|'))$" ./... 2>&1 | tee scoped.log
            for t in ${{ inputs.test-filter }}; do
              grep -qE "^=== RUN[[:space:]]+${t}(/|$)" scoped.log || exit 1
            done
          else
            go test ./...
          fi
